    - endpoints: ["lab8-sw2:Ethernet0/3", "lab8-sw3:Ethernet0/2"]

    # -------------------------------------------------------------------------
    # PART 2 Links (다층 구조 이중화 메시 배선)
    # -------------------------------------------------------------------------
    # Core Interconnect (Port-Channel 1 번들)
    - endpoints: ["core-sw1:Ethernet0/1", "core-sw2:Ethernet0/1"]
    - endpoints: ["core-sw1:Ethernet0/2", "core-sw2:Ethernet0/2"]

    # Core to Distribution Links (Cross-connect Mesh)
    - endpoints: ["core-sw1:Ethernet0/3", "dist-sw1:Ethernet0/1"]
    - endpoints: ["core-sw1:Ethernet1/0", "dist-sw2:Ethernet0/1"]
    - endpoints: ["core-sw2:Ethernet0/3", "dist-sw1:Ethernet0/2"]
    - endpoints: ["core-sw2:Ethernet1/0", "dist-sw2:Ethernet0/2"]

    # Distribution Interconnect (Port-Channel 2 번들)
    - endpoints: ["dist-sw1:Ethernet0/3", "dist-sw2:Ethernet0/3"]

    # Distribution to Access Links (Dual-homed Uplinks)
    - endpoints: ["dist-sw1:Ethernet1/0", "acc-sw1:Ethernet0/1"]
    - endpoints: ["dist-sw2:Ethernet1/0", "acc-sw1:Ethernet0/2"]
    - endpoints: ["dist-sw1:Ethernet1/1", "acc-sw2:Ethernet0/1"]
    - endpoints: ["dist-sw2:Ethernet1/1", "acc-sw2:Ethernet0/2"]
