all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    cisco_iol:
      vars:
        # ansible_connection: set ansible_connection variable if required
        ansible_user: admin
        ansible_password: admin
      hosts:
        clab-iol-multitier-integration-acc-sw1:
          ansible_host: 192.168.100.105
        clab-iol-multitier-integration-acc-sw2:
          ansible_host: 192.168.100.106
        clab-iol-multitier-integration-core-sw1:
          ansible_host: 192.168.100.101
        clab-iol-multitier-integration-core-sw2:
          ansible_host: 192.168.100.102
        clab-iol-multitier-integration-dist-sw1:
          ansible_host: 192.168.100.103
        clab-iol-multitier-integration-dist-sw2:
          ansible_host: 192.168.100.104
